policy:
  name: desk_social_ppo_v1
  observation_schema: desk_social_rl_v1
  algorithm: PPO
  controller: direct_continuous_actions
  control_hz: 20
environment:
  xml_path: assets/trax/desk_scene.xml
  frameskip: 25
  restrict_to_zone: true
  safety_enabled: true
  human_scenarios: true
  domain_randomization: true
  animate_tracks: false
training:
  total_timesteps: 262144
  n_envs: 4
  n_steps: 512
  batch_size: 256
  n_epochs: 6
  learning_rate: 0.0003
  gamma: 0.995
  gae_lambda: 0.95
  ent_coef: 0.01
  clip_range: 0.2
  horizon: 600
  net_arch: [128, 128]
  torch_threads: 1
  seed: 42
evaluation:
  frequency: 65536
  horizon: 1800
  validation_seeds: [1001, 1002]
  test_seeds: [2001, 2002, 2003]
  test_yaws: [0.0, 3.141592653589793, -1.5707963267948966]
  gates:
    wave_response_rate: 0.5
    people_noticed: 2.0
    objects_inspected: 1.0
    safety_override_rate: 0.05
